[package]
name = "mailcraft-web"
description = "MailCraft in the browser (eframe web runner, JMAP over fetch, WebGPU with WebGL2 fallback)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "mailcraft-web"
path = "src/main.rs"

# //// Neoffice — serde_json and mailcraft-engine on every target: what is kept between visits with a hosting page's
# mailboxes is read and written by kept.rs, which is built natively too, for its tests, and reads the page's signature
# with mailcraft-engine's mime (page_signature, maintenance#1670).
[dependencies]
serde_json = { workspace = true }
mailcraft-engine = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# //// Neoffice — mailcraft-engine is a dependency on every target now (above).
mailcraft-jmap = { workspace = true }
mailcraft-ui-egui = { workspace = true }
egui = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }
# `wgpu` pulls egui-wgpu's defaults: WebGPU plus the WebGL2 fallback; `persistence` keeps
# settings in the page's localStorage.
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "persistence"] }
# The browser's file picker (attach, insert pictures).
rfd = "0.17"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlAnchorElement", "Location",
    "Blob", "BlobPropertyBag", "Url",
    "Headers", "Request", "RequestInit", "RequestMode", "RequestCredentials", "RequestCache", "Response",
    "ReadableStream", "ReadableStreamDefaultReader", "AbortController", "AbortSignal",
    "IdbFactory", "IdbOpenDbRequest", "IdbRequest", "IdbDatabase", "IdbTransaction", "IdbTransactionMode", "IdbObjectStore",
    "DomStringList", "Event",
    # //// Neoffice — the hosting page's `?author=`, read as the document editors read it (host.rs).
    "UrlSearchParams",
    # //// Neoffice — the HTML of what is pasted, for the editor (paste.rs, maintenance#1705).
    "ClipboardEvent", "DataTransfer",
] }
